[project]
name = "magic-tricks"
version = "0.1.0"
description = "Video magic tricks with Grounding DINO zero-shot detection, OpenCV and ArUco markers"
readme = "README.md"
authors = [
    { name = "shormat" },
    { name = "CorentinXM" },
    { name = "GuenfoudiIhabe" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
    "pillow>=10.0",
    "torch>=2.1",
    "torchvision>=0.29.1",
    "transformers>=5",
]

[tool.uv]
package = false
